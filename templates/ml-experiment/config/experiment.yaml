# Experiment configuration
experiment:
  name: "{{name}}"
  seed: 42
  notes: "Baseline run — discuss hyperparameters in session chat before training"

model:
  architecture: resnet18
  pretrained: false
  num_classes: 10

data:
  dataset: cifar10
  data_dir: data
  train_split: 0.9
  batch_size: 128
  num_workers: 2
  # Optional CPU caps (omit or set null for the full split)
  max_train_samples: null
  max_val_samples: null
  augmentation:
    random_flip: true
    normalize: true

training:
  device: auto
  epochs: 20
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.01
  scheduler: cosine
  early_stopping_patience: 5

evaluation:
  primary_metric: accuracy
  eval_every_epochs: 1

output:
  checkpoint_dir: experiments/checkpoints
  log_dir: experiments/logs
  save_best_only: true
